openapi: 3.1.0
info:
  title: ExamGuru Platform API
  version: 1.0.0
  description: |
    Provider-neutral API contract for authenticated ExamGuru operations.
    This is a design contract only; it does not indicate that a production API
    is deployed. All tenant and platform authorization is enforced server-side.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; no provider or production endpoint is selected.
tags:
  - name: Identity
  - name: Institutions
  - name: Memberships
  - name: Content
  - name: Demos
  - name: Platform
  - name: Audit
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      tags: [Platform]
      responses:
        "200":
          description: Service health without sensitive deployment details.
  /api/v2/auth/me:
    get:
      operationId: getCurrentIdentity
      tags: [Identity]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated identity and permitted memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/auth/context:
    post:
      operationId: selectActiveContext
      tags: [Identity]
      security:
        - bearerAuth: []
      description: |
        Selects a navigation context only. The server must independently
        authorize every subsequent resource request; context selection is
        never itself an authorization grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContextSelection"
      responses:
        "200":
          description: Validated active context.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/auth/sessions/current:
    delete:
      operationId: revokeCurrentSession
      tags: [Identity]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Current session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/institutions:
    get:
      operationId: listMyInstitutions
      tags: [Institutions]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Institutions the caller is authorized to discover.
    post:
      operationId: createInstitution
      tags: [Institutions]
      security:
        - bearerAuth: []
      description: Platform Admin only. Creates an institution and initial lifecycle record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionCreate"
      responses:
        "201":
          description: Institution created.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v2/institutions/{institutionId}/memberships:
    parameters:
      - $ref: "#/components/parameters/InstitutionId"
    get:
      operationId: listInstitutionMemberships
      tags: [Memberships]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Memberships visible to the authorized caller.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createInstitutionMembership
      tags: [Memberships]
      security:
        - bearerAuth: []
      description: |
        Creates or invites a membership only when the actor has the required
        institution-scoped administration grant. Role and branch scope are
        validated against policy; the client cannot grant itself privileges.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipCreate"
      responses:
        "201":
          description: Membership created or invitation issued.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/content/banks/{bankId}:
    parameters:
      - name: bankId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getAuthorizedQuestionBank
      tags: [Content]
      security:
        - bearerAuth: []
      description: |
        Returns only the released content subset the caller is entitled to use.
        Master authoring banks, answer keys and restricted blueprints must not
        be included unless the caller has an explicit server-side grant.
      responses:
        "200":
          description: Authorized released bank content.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/platform/demos:
    get:
      operationId: listDemoEnvironments
      tags: [Demos]
      security:
        - bearerAuth: []
      description: Platform Admin only.
      responses:
        "200":
          description: Demo environments and expiry status.
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createDemoEnvironment
      tags: [Demos]
      security:
        - bearerAuth: []
      description: |
        Platform Admin only. Creates a time-limited isolated demo environment.
        Allowed durations are policy-controlled (initial defaults 1, 3, 7 or
        14 days). Expiry is stored and enforced by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoCreate"
      responses:
        "201":
          description: Demo environment created.
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/v2/platform/demos/{demoId}/audit:
    parameters:
      - name: demoId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listDemoAuditEvents
      tags: [Demos]
      security:
        - bearerAuth: []
      description: Platform Admin only. Returns append-only lifecycle events with no credentials or tokens.
      responses:
        "200":
          description: Demo lifecycle audit events.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/demo/login:
    post:
      operationId: loginToDemo
      tags: [Demos]
      description: Public login for a time-limited demo account. Returns an opaque demo-only bearer token; it cannot access normal learner or institution API routes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 8, maxLength: 40 }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        "200":
          description: Demo-only session token with expiry.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Demo account temporarily locked after repeated failed attempts.
  /api/demo/me:
    get:
      operationId: getDemoSession
      tags: [Demos]
      security:
        - bearerAuth: []
      description: Demo-session only. Returns synthetic demo identity and expiry.
      responses:
        "200":
          description: Demo session context.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/demo/data:
    get:
      operationId: getDemoSampleData
      tags: [Demos]
      security:
        - bearerAuth: []
      description: Demo-session only. Read-only sample data for the current isolated demo tenant and reset generation.
      responses:
        "200":
          description: Synthetic sample records.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/demo/logout:
    post:
      operationId: logoutDemoSession
      tags: [Demos]
      security:
        - bearerAuth: []
      description: Revokes the current demo session token.
      responses:
        "200":
          description: Demo session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v2/platform/demos/{demoId}/extend:
    parameters:
      - name: demoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: extendDemoEnvironment
      tags: [Demos]
      security:
        - bearerAuth: []
      description: Platform Admin only. Extension is capped at 14 days remaining lifetime and invalidates previous demo sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoExtend"
      responses:
        "200":
          description: Demo expiry extended and session version rotated.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/v2/platform/demos/{demoId}/reset:
    parameters:
      - name: demoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: resetDemoEnvironment
      tags: [Demos]
      security:
        - bearerAuth: []
      description: Platform Admin only. Restores synthetic sample data to the persona baseline and invalidates previous demo sessions.
      responses:
        "204":
          description: Demo sample data reset.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/platform/demos/{demoId}/revoke:
    parameters:
      - name: demoId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: revokeDemoEnvironment
      tags: [Demos]
      security:
        - bearerAuth: []
      description: Platform Admin only; invalidates all demo sessions.
      responses:
        "204":
          description: Demo access revoked.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v2/platform/audit-events:
    get:
      operationId: listPlatformAuditEvents
      tags: [Audit]
      security:
        - bearerAuth: []
      description: Platform Admin only. Append-only events; sensitive credentials and tokens are never recorded.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Paginated audit events.
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque session token
  parameters:
    InstitutionId:
      name: institutionId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked session.
    Forbidden:
      description: Authenticated actor lacks the required permission or scope.
    NotFound:
      description: Resource does not exist or is outside the caller's authorized visibility.
    InvalidRequest:
      description: Request failed schema or business-policy validation.
  schemas:
    IdentityContext:
      type: object
      required: [user, platformRoles, memberships]
      properties:
        user:
          type: object
          required: [userId, status]
          properties:
            userId: { type: string }
            displayName: { type: string }
            status: { type: string, enum: [active, suspended, disabled] }
        platformRoles:
          type: array
          items: { type: string, enum: [platform_admin] }
        memberships:
          type: array
          items:
            type: object
            required: [membershipId, institutionId, role, status]
            properties:
              membershipId: { type: string }
              institutionId: { type: string }
              role:
                type: string
                enum: [school_admin, teacher, parent, student, institution_viewer]
              status: { type: string, enum: [active, suspended, revoked] }
              branchIds:
                type: array
                items: { type: string }
              allBranches: { type: boolean, default: false }
        departmentAppointments:
          type: array
          description: Department-head responsibility is an appointment layered over a teacher membership, not a standalone login or institution membership role.
          items:
            type: object
            required: [appointmentId, departmentId, appointmentType, status]
            properties:
              appointmentId: { type: string }
              departmentId: { type: string }
              appointmentType: { type: string, enum: [primary, backup] }
              status: { type: string, enum: [active, ended] }
        activeContext:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ContextSelection"
    ContextSelection:
      type: object
      required: [institutionId, membershipId]
      properties:
        institutionId: { type: string }
        membershipId: { type: string }
        branchId:
          type: [string, "null"]
    InstitutionCreate:
      type: object
      required: [name, institutionType]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        institutionType: { type: string, enum: [school, coaching, direct, other] }
    MembershipCreate:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role:
          type: string
          enum: [school_admin, teacher, parent, student, institution_viewer]
        branchIds:
          type: array
          uniqueItems: true
          items: { type: string }
        allBranches: { type: boolean, default: false }
    DemoCreate:
      oneOf:
        - $ref: "#/components/schemas/PersonaDemoCreate"
        - $ref: "#/components/schemas/OnDemandDemoCreate"
    PersonaDemoCreate:
      type: object
      required: [kind, templateId]
      properties:
        kind: { type: string, const: persona }
        templateId: { type: string, minLength: 1 }
        displayName: { type: string, maxLength: 100 }
        durationDays: { type: integer, enum: [1, 3, 7, 14], default: 7 }
    OnDemandDemoCreate:
      type: object
      required: [kind, roles]
      properties:
        kind: { type: string, const: on_demand }
        displayName: { type: string, maxLength: 100 }
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [school_admin, hod, teacher, parent, student, institution_viewer]
        dataProfile: { type: string, enum: [standard_sample, school_sample, department_sample, teaching_sample, parent_sample, student_sample] }
        durationDays: { type: integer, enum: [1, 3, 7, 14], default: 7 }
    DemoExtend:
      type: object
      required: [additionalDays]
      properties:
        additionalDays: { type: integer, enum: [1, 3, 7, 14] }
