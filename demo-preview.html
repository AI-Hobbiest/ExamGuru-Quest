<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Demo preview · ExamGuru Quest</title><link rel="stylesheet" href="./css/branding.css"><style>body{font:15px system-ui;background:#f6f5fb;color:#28234d;margin:0}.wrap{max-width:1050px;margin:28px auto;padding:0 18px}.card{background:white;border:1px solid #e5e1ef;border-radius:16px;padding:20px;margin:14px 0}.muted{color:#77718a}.pill{display:inline-block;background:#efedfa;padding:4px 9px;border-radius:30px;margin:3px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.tile{background:#f7f6fc;border-radius:12px;padding:14px}.tile b{display:block;font-size:1.5rem}.btn{background:#5143ad;color:white;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.record{padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}@media(max-width:600px){.wrap{margin:10px auto}.card{padding:15px}}</style></head><body><main class="wrap"><section class="card"><p><b>EXAMGURU QUEST · ISOLATED DEMO</b></p><h1 id="name">Loading demo…</h1><p class="muted">Read-only demonstration. All names and records are synthetic. This session cannot access real institution or learner records.</p><div id="roles"></div><p id="expiry" class="muted"></p><button class="btn" id="out">Sign out</button></section><section class="card"><h2>Sample environment</h2><div class="grid" id="summary"></div></section><section class="card"><h2>Sample records</h2><div id="records">Loading…</div></section></main><script src="./js/api-config.js"></script><script>
(async()=>{const token=sessionStorage.getItem("eg_demo_token"),base=String(window.C10_API_BASE||"").replace(/\/+$/,"");if(!token||!base){location.replace("./demo-login.html");return;}async function api(path,method){const r=await fetch(base+path,{method:method||"GET",headers:{Authorization:"Bearer "+token},cache:"no-store"}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||"Demo session expired");return d;}try{const [me,data]=await Promise.all([api("/api/demo/me"),api("/api/demo/data")]);document.getElementById("name").textContent=me.demo.displayName;document.getElementById("roles").innerHTML=me.user.roles.map(r=>'<span class="pill">'+r.replace(/[&<>"]/g,"")+'</span>').join("");document.getElementById("expiry").textContent="Session expires: "+new Date(me.demo.expiresAt).toLocaleString();const groups={};data.records.forEach(x=>(groups[x.type]||(groups[x.type]=[])).push(x));document.getElementById("summary").innerHTML=Object.keys(groups).map(k=>'<div class="tile"><b>'+groups[k].length+'</b>'+k.replace(/-/g," ")+'</div>').join("");document.getElementById("records").innerHTML=data.records.map(x=>'<div class="record"><b>'+x.type+' · '+x.id+'</b><span>'+JSON.stringify(x.payload).replace(/[&<>"]/g,"")+'</span></div>').join("");}catch(e){sessionStorage.removeItem("eg_demo_token");document.getElementById("name").textContent=e.message;setTimeout(()=>location.replace("./demo-login.html"),1200);}})();
document.getElementById("out").addEventListener("click",async()=>{const token=sessionStorage.getItem("eg_demo_token"),base=String(window.C10_API_BASE||"").replace(/\/+$/,"");try{await fetch(base+"/api/demo/logout",{method:"POST",headers:{Authorization:"Bearer "+token}});}catch(_){}sessionStorage.removeItem("eg_demo_token");location.replace("./demo-login.html");});
</script></body></html>
