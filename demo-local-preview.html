<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local demo preview · ExamGuru Quest</title><link rel="stylesheet" href="./css/branding.css"><style>body{font:15px system-ui;background:#f6f5fb;color:#28234d;margin:0}.wrap{max-width:1000px;margin:28px auto;padding:0 18px}.card{background:white;border:1px solid #e5e1ef;border-radius:16px;padding:20px;margin:14px 0}.muted{color:#77718a;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.tile{background:#f7f6fc;border-radius:12px;padding:14px}.tile b{display:block;font-size:1.05rem}.notice{padding:12px;background:#fff8e9;border-left:3px solid #d49b39;color:#725522;line-height:1.5}.btn{display:inline-block;background:#5143ad;color:white;border:0;border-radius:9px;padding:10px 14px;font-weight:700;text-decoration:none}</style></head><body><main class="wrap"><section class="card"><p><b>EXAMGURU QUEST · INTERNAL LOCAL DEMO</b></p><h1 id="name">Loading…</h1><p class="muted" id="meta"></p><div id="roles"></div><p class="notice">This preview reads synthetic data from this browser's local storage. It is not an externally accessible demo account and provides no server-enforced security or expiry.</p><a class="btn" href="./platform-demo-management.html">Back to Demo Management</a></section><section class="card"><h2>Persona workspace preview</h2><div class="grid" id="workspace"></div></section><section class="card"><h2>Synthetic sample records</h2><div class="grid" id="records"></div></section></main><script>
(function(){const params=new URLSearchParams(location.search),id=params.get("id");let list=[];try{list=JSON.parse(localStorage.getItem("examguru_m7_local_demos_v1")||"[]");}catch(_){}const d=list.find(x=>x.demoId===id);if(!d){document.getElementById("name").textContent="Demo not found in this browser";return;}const expired=new Date(d.expiresAt).getTime()<=Date.now(),revoked=d.status==="revoked";document.getElementById("name").textContent=d.displayName;document.getElementById("meta").textContent="Status: "+(revoked?"revoked":expired?"expired":"active")+" · Expires: "+new Date(d.expiresAt).toLocaleString()+" · Reset generation: "+d.resetGeneration;document.getElementById("roles").textContent="Roles: "+d.roles.join(", ");const modules=d.roles.flatMap(r=>({school_admin:["Institution overview","Academic structure","People directory","Assignments"],institution_viewer:["Read-only institution summary","Performance overview"],teacher:["Assigned classes","Assessments","Learner progress"],hod:["Department overview","Department performance"],parent:["Linked learner progress","Assigned tests"],student:["Practice","Study Library","Personal progress"]}[r]||[]));document.getElementById("workspace").innerHTML=[...new Set(modules)].map(x=>'<div class="tile"><b>'+x+'</b><span class="muted">Synthetic preview module</span></div>').join("");document.getElementById("records").innerHTML=(d.records||[]).map(x=>'<div class="tile"><b>'+x.type+'</b>'+x.name+'<br><span class="muted">'+(x.className||x.score||"Synthetic record")+'</span></div>').join("");if(expired||revoked)document.getElementById("workspace").innerHTML='<div class="tile"><b>Preview unavailable</b><span class="muted">This demo is '+(revoked?"revoked":"expired")+'. Return to Demo Management to review it.</span></div>';})();
</script></body></html>
