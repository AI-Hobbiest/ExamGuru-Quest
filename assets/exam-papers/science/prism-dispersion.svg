<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">Dispersion of white light by a prism</title><desc id="d">A white ray enters a triangular glass prism and emerges as a spectrum from red to violet.</desc><rect width="760" height="320" fill="#fff"/><g stroke-linejoin="round"><path d="M300 60 L465 255 L210 255 Z" fill="#e0f2fe" fill-opacity=".7" stroke="#2563eb" stroke-width="3"/><path d="M55 155 H300" stroke="#334155" stroke-width="5"/><path d="M300 155 L445 183" stroke="#334155" stroke-width="4"/><path d="M445 183 L700 75" stroke="#dc2626" stroke-width="4"/><path d="M445 183 L700 105" stroke="#f97316" stroke-width="4"/><path d="M445 183 L700 135" stroke="#eab308" stroke-width="4"/><path d="M445 183 L700 165" stroke="#16a34a" stroke-width="4"/><path d="M445 183 L700 195" stroke="#2563eb" stroke-width="4"/><path d="M445 183 L700 225" stroke="#7c3aed" stroke-width="4"/></g><g font-family="Arial,sans-serif" fill="#172554"><text x="45" y="125" font-size="20">White light</text><text x="340" y="290" font-size="18" text-anchor="middle">Glass prism</text><text x="625" y="45" font-size="17">Red (least deviation)</text><text x="625" y="260" font-size="17">Violet (most deviation)</text><text x="380" y="25" font-size="22" font-weight="bold" text-anchor="middle">Dispersion of white light (schematic)</text><text x="380" y="312" font-size="13" text-anchor="middle">Not to scale</text></g></svg>