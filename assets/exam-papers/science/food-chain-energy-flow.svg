<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="t d"><title id="t">Food chain and energy flow</title><desc id="d">Energy flows from grass to grasshopper to frog to snake; decomposers recycle nutrients.</desc><rect width="720" height="260" rx="18" fill="#f8fbff"/><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#26364d"><g stroke="#497b55" stroke-width="2"><rect x="20" y="75" width="130" height="70" rx="12" fill="#d9f0df"/><rect x="195" y="75" width="130" height="70" rx="12" fill="#e7f1d6"/><rect x="370" y="75" width="130" height="70" rx="12" fill="#dceaff" stroke="#426da7"/><rect x="545" y="75" width="150" height="70" rx="12" fill="#f5e5ff" stroke="#8653a8"/></g><text x="85" y="117">Grass</text><text x="260" y="117">Grasshopper</text><text x="435" y="117">Frog</text><text x="620" y="117">Snake</text><g stroke="#344e70" stroke-width="3" fill="none"><path d="M150 110H193M325 110H368M500 110H543"/><path d="M182 101l11 9-11 9M357 101l11 9-11 9M532 101l11 9-11 9"/></g><text x="360" y="45" font-size="15">Energy decreases at each trophic level</text><rect x="245" y="180" width="230" height="48" rx="10" fill="#fff0d9" stroke="#b88632" stroke-width="2"/><text x="360" y="210" font-size="15">Decomposers recycle nutrients</text></g></svg>