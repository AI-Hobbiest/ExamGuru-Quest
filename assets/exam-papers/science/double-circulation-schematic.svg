<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">Simplified double circulation</title><desc id="d">Four labelled heart chambers and lungs and body circulation with directional arrows.</desc><rect width="760" height="360" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle"><text x="380" y="32" font-size="22" font-weight="bold">Double circulation (schematic)</text><rect x="75" y="92" width="150" height="70" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150" y="132" font-size="18">Lungs</text><rect x="535" y="92" width="150" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="610" y="132" font-size="18">Body tissues</text><rect x="270" y="90" width="95" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="317" y="119" font-size="14">Right</text><text x="317" y="139" font-size="14">atrium</text><rect x="270" y="205" width="95" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="317" y="234" font-size="14">Right</text><text x="317" y="254" font-size="14">ventricle</text><rect x="395" y="90" width="95" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="442" y="119" font-size="14">Left</text><text x="442" y="139" font-size="14">atrium</text><rect x="395" y="205" width="95" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="442" y="234" font-size="14">Left</text><text x="442" y="254" font-size="14">ventricle</text><g fill="none" stroke-width="4"><path d="M270 240 H238 V127 H225" stroke="#2563eb"/><path d="M365 240 H382 V127 H395" stroke="#dc2626"/><path d="M490 240 H515 V127 H535" stroke="#dc2626"/><path d="M535 150 H510 V290 H317 V275" stroke="#2563eb"/></g><g fill="#2563eb"><path d="M225 127 l12 -7 v14z"/><path d="M317 275 l-7 -12 h14z"/></g><g fill="#dc2626"><path d="M395 127 l-12 -7 v14z"/><path d="M535 127 l-12 -7 v14z"/></g>