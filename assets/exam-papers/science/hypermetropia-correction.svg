<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">Correction of hypermetropia</title><desc id="desc">A convex spectacle lens converges rays from a nearby object so that the eye lens can focus them on the retina.</desc>
<rect width="800" height="400" fill="#fff"/>
<g stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M80 100 V300" stroke="#7c3aed"/><path d="M80 100 L80 300" stroke-width="6"/>
<path d="M215 85 Q250 200 215 315 Q180 200 215 85" fill="#dbeafe" stroke="#2563eb"/>
<path d="M470 120 C560 65 650 90 700 200 C650 310 560 335 470 280 C430 245 430 155 470 120 Z" fill="#fef3c7" stroke="#b45309"/>
<path d="M700 200 L740 200" stroke="#b45309" stroke-width="8"/>
<path d="M80 115 L215 155 L470 145 L700 200" stroke="#dc2626"/>
<path d="M80 285 L215 245 L470 255 L700 200" stroke="#dc2626"/>
<path d="M700 200 L730 200" stroke="#dc2626"/>
<path d="M700 110 V290" stroke="#16a34a" stroke-width="5"/>
</g>
<g fill="#1f2937" font-family="Arial,sans-serif" font-size="20">
<text x="30" y="75">Nearby object</text><text x="160" y="355">Convex spectacle lens</text>
<text x="515" y="55">Eye</text><text x="640" y="335">Retina</text>
<text x="425" y="375" font-size="16">Schematic: corrective lens helps focus the image on the retina</text>
</g>
</svg>