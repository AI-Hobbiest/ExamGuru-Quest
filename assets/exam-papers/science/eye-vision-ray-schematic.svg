<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Eye correction ray schematic</title><desc id="d">Simplified eye with a concave correcting lens that diverges parallel rays slightly before the eye lens focuses them on the retina.</desc><rect width="760" height="300" fill="#fff"/><g fill="none" stroke="#172554" stroke-width="3"><path d="M75 75 H270 M75 150 H270 M75 225 H270" stroke="#2563eb"/><path d="M270 48 Q235 150 270 252" stroke="#7c3aed" stroke-width="5"/><path d="M300 35 Q410 150 300 265" stroke="#64748b" stroke-width="2"/><path d="M335 50 Q510 150 335 250" stroke="#64748b"/><path d="M335 50 Q525 70 605 150 Q525 230 335 250" stroke="#64748b"/><path d="M270 75 L430 115 L605 150 M270 150 L605 150 M270 225 L430 185 L605 150" stroke="#2563eb"/></g><g font-family="Arial,sans-serif" fill="#172554"><text x="70" y="32" font-size="18">Incoming rays</text><text x="225" y="285" font-size="16">Concave lens</text><text x="410" y="25" font-size="16">Eye lens</text><text x="620" y="155" font-size="16">Retina</text><text x="380" y="285" font-size="14">Schematic only — not to scale</text></g></svg>