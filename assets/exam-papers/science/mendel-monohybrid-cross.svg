<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-labelledby="t d"><title id="t">Mendel monohybrid cross</title><desc id="d">Punnett square for Tt crossed with Tt showing TT, Tt, Tt and tt.</desc><rect width="620" height="330" rx="18" fill="#f8fbff"/><g font-family="Arial,sans-serif" fill="#26364d"><text x="310" y="35" font-size="22" text-anchor="middle" font-weight="bold">Tt × Tt</text><text x="210" y="84" font-size="16" text-anchor="middle">Gametes</text><text x="310" y="84" font-size="17" text-anchor="middle">T</text><text x="420" y="84" font-size="17" text-anchor="middle">t</text><text x="130" y="155" font-size="17" text-anchor="middle">T</text><text x="130" y="245" font-size="17" text-anchor="middle">t</text><g stroke="#56708f" stroke-width="2"><rect x="255" y="105" width="110" height="90" fill="#d9f0df"/><rect x="365" y="105" width="110" height="90" fill="#dceaff"/><rect x="255" y="195" width="110" height="90" fill="#dceaff"/><rect x="365" y="195" width="110" height="90" fill="#ffe7d6"/></g><g font-size="25" font-weight="bold" text-anchor="middle"><text x="310" y="160">TT</text><text x="420" y="160">Tt</text><text x="310" y="250">Tt</text><text x="420" y="250">tt</text></g><text x="310" y="315" font-size="16" text-anchor="middle">Phenotypic ratio = 3 tall : 1 dwarf</text></g></svg>