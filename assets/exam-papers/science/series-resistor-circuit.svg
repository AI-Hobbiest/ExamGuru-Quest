<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d"><title id="t">Series resistor circuit</title><desc id="d">A 12 volt battery connected in series to 2 ohm and 4 ohm resistors.</desc><rect width="760" height="250" fill="white"/><g fill="none" stroke="#172554" stroke-width="4" stroke-linejoin="round"><path d="M110 95 H230 M330 95 H455 M555 95 H650 V190 H110 V95"/><rect x="230" y="75" width="100" height="40" rx="3" fill="#e0e7ff"/><rect x="455" y="75" width="100" height="40" rx="3" fill="#e0e7ff"/><path d="M110 145 V190 M90 145 H130 M98 157 H122"/></g><g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle"><text x="280" y="101" font-size="18">2 Ω</text><text x="505" y="101" font-size="18">4 Ω</text><text x="110" y="130" font-size="16">12 V</text><text x="380" y="40" font-size="22" font-weight="bold">Series circuit (schematic)</text><text x="380" y="225" font-size="14">One current path through both resistors</text></g></svg>