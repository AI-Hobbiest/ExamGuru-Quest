<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">15 volt series circuit with three resistors</title>
<desc id="desc">A 15 volt battery supplies three series-connected resistors labelled 2 ohms, 3 ohms and 5 ohms.</desc>
<rect width="900" height="260" fill="#fff"/>
<g fill="none" stroke="#172554" stroke-width="4" stroke-linejoin="round">
<path d="M115 100 H250 M350 100 H430 M530 100 H610 M710 100 H790 V195 H115 V100"/>
<rect x="250" y="80" width="100" height="40" rx="3" fill="#e0e7ff"/>
<rect x="430" y="80" width="100" height="40" rx="3" fill="#e0e7ff"/>
<rect x="610" y="80" width="100" height="40" rx="3" fill="#e0e7ff"/>
<path d="M115 140 V195 M95 140 H135 M103 153 H127"/>
</g>
<g font-family="Arial,sans-serif" fill="#172554" text-anchor="middle">
<text x="300" y="106" font-size="19">2 Ω</text><text x="480" y="106" font-size="19">3 Ω</text><text x="660" y="106" font-size="19">5 Ω</text>
<text x="115" y="127" font-size="17">15 V</text>
<text x="450" y="38" font-size="22" font-weight="bold">Series circuit (schematic)</text>
<text x="450" y="234" font-size="15">One current path through all three resistors</text>
</g></svg>