<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" role="img" aria-labelledby="title desc">
<title id="title">Human alimentary canal — NCERT Class 10 Science, Figure 5.6</title>
<desc id="desc">Original ExamGuru redraw of the human alimentary canal, showing the mouth and tongue, oesophagus, diaphragm, liver, gall bladder, bile duct, pancreas, stomach, small intestine, large intestine, appendix and anus.</desc>
<defs>
