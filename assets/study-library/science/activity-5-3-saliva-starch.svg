<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
<title id="t">Activity 5.3 — Action of saliva on starch</title>
<desc id="d">Two test tubes each contain 1 mL of 1% starch solution. Add 1 mL saliva to tube A only. Leave both undisturbed for 20–30 minutes, then add dilute iodine. Tube A does not turn blue-black because saliva breaks down starch; tube B turns blue-black because starch remains.</desc>
