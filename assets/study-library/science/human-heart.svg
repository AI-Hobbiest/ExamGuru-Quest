<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" role="img" aria-labelledby="t d">
<title id="t">Figure 5.10 — Schematic sectional view of the human heart</title>
<desc id="d">NCERT-aligned sectional heart diagram. The right side of the heart appears on the viewer's left in blue and the left side on the viewer's right in red. Arrows show blood flow. Labels match the NCERT figure.</desc>
<defs>
 <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker>
 <style>
 .lbl{font:20px Arial,sans-serif;fill:#202b36}.lead{fill:none;stroke:#263746;stroke-width:2}
 .blue{fill:#b9d9ef;stroke:#273d50;stroke-width:5;stroke-linejoin:round}
 .red{fill:#f2b1a5;stroke:#793b37;stroke-width:5;stroke-linejoin:round}
 .vblue{fill:none;stroke:#3c84b9;stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
 .vred{fill:none;stroke:#c84b45;stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
 .flow{fill:none;stroke:#263746;stroke-width:3;marker-end:url(#arrB)}
 </style>
</defs>
<rect width="980" height="760" fill="#fff"/>
<text x="490" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#203b55">HUMAN HEART</text>
