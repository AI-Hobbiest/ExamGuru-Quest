<path class="blue" d="M390 390 C420 365 490 370 510 420 L515 575 C485 620 425 635 390 590 C360 545 355 445 390 390Z"/>
<path class="red" d="M520 275 C545 225 635 225 665 270 C690 310 680 365 640 385 C600 405 545 390 520 355Z"/>
<path class="red" d="M525 395 C555 360 650 370 675 415 C700 465 685 565 640 605 C600 635 540 620 520 575Z"/>
