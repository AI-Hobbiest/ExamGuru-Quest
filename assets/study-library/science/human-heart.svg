 <text x="35" y="118">Vena Cava</text><text x="35" y="142">from upper body</text>
 <text x="35" y="270">Right atrium</text>
 <text x="35" y="405">Vena Cava</text><text x="35" y="429">from lower body</text>
 <text x="35" y="535">Right ventricle</text>
 <text x="35" y="665">Septum</text><text x="35" y="689">(dividing wall)</text>
</g>
