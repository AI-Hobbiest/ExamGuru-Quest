name: CLAT UG 2027 Engine Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'clat.html'
      - 'clat-dashboard.html'
      - 'js/clat-engine.js'
      - 'js/clat-practice.js'
      - 'js/clat-dashboard-model.js'
      - 'js/clat-dashboard.js'
      - 'js/clat-pdf.js'
      - 'tests/clat-pdf.test.js'
      - 'data/clat/**'
      - 'tests/clat-engine.test.js'
      - 'tests/clat-dashboard.test.js'
      - 'tests/clat-batch-01-uniqueness.test.js'
      - 'tests/clat-rebuild-006-010.test.js'
      - '.github/workflows/clat-validation.yml'
  push:
    branches: [main, feature/clat-ug-2027-engine]
    paths:
      - 'clat.html'
      - 'js/clat-engine.js'
      - 'js/clat-practice.js'
      - 'data/clat/**'
      - 'tests/clat-engine.test.js'
      - 'tests/clat-batch-01-uniqueness.test.js'
      - 'tests/clat-rebuild-006-010.test.js'
      - '.github/workflows/clat-validation.yml'
permissions:
  contents: read
jobs:
  clat-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check CLAT JavaScript syntax
        run: |
          node --check js/clat-engine.js
          node --check js/clat-practice.js
          node --check js/clat-dashboard-model.js
          node --check js/clat-dashboard.js
          node --check tests/clat-dashboard.test.js
          node --check js/clat-pdf.js
          node --check tests/clat-pdf.test.js
          node --check tests/clat-engine.test.js
          node --check tests/clat-batch-01-uniqueness.test.js
          node --check tests/clat-rebuild-006-010.test.js
      - name: Validate CLAT paper data and scoring
        run: |
          node tests/clat-engine.test.js
          node tests/clat-dashboard.test.js
          node tests/clat-pdf.test.js
          node tests/clat-full-length-draft.test.js
          node tests/clat-full-length-draft-002.test.js
          node tests/clat-full-length-draft-003.test.js
          node tests/clat-full-length-draft-004.test.js
          node tests/clat-full-length-draft-005.test.js
          node tests/clat-batch-01-uniqueness.test.js
          node tests/clat-rebuild-006-010.test.js
