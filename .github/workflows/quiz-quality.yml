name: ExamGuru Quest quiz quality checks

on:
  push:
    branches: [main, m5/backward-compatible-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiz-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check assessment and Paper Studio workflow script syntax
        run: for file in js/assessment-manager.js js/parent-assessments.js js/assigned-test.js js/assigned-paper.js js/assigned-tests-dashboard.js js/dashboard-manager.js js/exam-paper-studio.js js/exam-paper-self-study.js js/lms-application-services.js js/institution-content-store.js js/iam-local-store.js js/institution-data-store.js js/institution-module.js js/institution-dashboard.js js/app-shell.js; do node --check "$file"; done
      - name: Validate M5.1–M5.3 LMS application services and compatibility boundary
        run: node --check js/lms-application-services.js && node --check js/domain/repository-contracts.js && node --check js/adapters/memory-repositories.js && node tests/lms-application-services.test.js && node tests/institution-content-store.test.js
      - name: Validate M5.4–M5.6 learning records, role policy and adapter readiness
        run: node --check js/m5-integration-services.js && node tests/m5-integration-services.test.js
      - name: Validate audited Science paper blueprint, generation and rendering
        run: node tests/assessment-manager.test.js && node tests/exam-paper-generator.test.js && node tests/mathematics-blueprints.test.js && node tests/mathematics-question-bank.test.js && node tests/mathematics-mcq-integration.test.js && node tests/exam-paper-renderer.test.js && node tests/exam-paper-release.test.js
      - name: Build shared Science bank from the maintained source
        run: node tests/build-science-bank-fixture.js
      - name: Validate existing Science MCQs in Exam Paper Studio
        run: node tests/science-integration.test.js
      - name: Validate the shared MCQ competency taxonomy and authoring gate
        run: node tests/mcq-competency.test.js && node tests/admin-workspace.test.js
      - name: Validate Stage C learning model, mastery and adaptive selection
        run: node tests/learning-model.test.js
      - name: Validate canonical ExamGuru Quest URLs
        run: node tests/canonical-url.test.js
      - name: Validate CBSE PYQ catalogue and Second Board coverage
        run: node tests/pyq-catalog.test.js
      - name: Validate exact CBSE PDF extraction
        run: python3 -m pip install --quiet pypdf && python3 -m py_compile scripts/extract_cbse_papers.py && python3 tests/test_cbse_extract.py && python3 -m py_compile scripts/extract_cbse_mcq_candidates.py && python3 tests/test_cbse_mcq_candidates.py
      - name: Validate Stage D Study Library model and rendering
        run: node tests/study-model.test.js
      - name: Validate Stage C backup compatibility and restore flow
        run: node tests/profile-model.test.js && node tests/profile-page.test.js
      - name: Validate NSO, IMO and IEO blueprints and section weighting
        run: node tests/olympiad-blueprints.test.js
      - name: Validate Class 3 English, Mathematics and SOF difficulty balance
        run: node tests/class3-english.test.js && node tests/class3-mathematics.test.js && node tests/class3-sof-blueprint.test.js && node tests/class3-imo-bank.test.js
      - name: Validate Class 6 CBSE and SOF bank inventories, provenance and routing
        run: node tests/class6-science.test.js && node tests/class6-mathematics-sof.test.js
      - name: Validate session timing, weighted marks and summary model
        run: node tests/session-model.test.js
      - name: Validate multi-tenant RBAC contracts and legacy compatibility
        run: python3 tests/rbac-migration.test.py && node tests/rbac-contract.test.js
      - name: Validate M1 provider-neutral repositories and authorization
        run: node --check js/domain/repository-contracts.js && node --check js/domain/authorization.js && node --check js/adapters/memory-repositories.js && node --check js/adapters/static-prototype-repositories.js && node tests/m1-authorization.test.js
      - name: Validate M2 identity, sessions and invitations
        run: node --check cloudflare/worker.js && python3 tests/m2-identity-session.test.py && node tests/m2-worker-contract.test.js
      - name: Validate M3 academic organisation and HOD scopes
        run: node --check js/domain/academic-organisation.js && python3 tests/m3-academic-organisation.test.py && node tests/m3-academic-organisation.test.js && node --check cloudflare/worker.js && node tests/m3-worker-api.test.js && node --check js/department-admin.js && node tests/m3-department-admin-ui.test.js
      - name: Validate role-based experience matrix
        run: node --check js/rbac-role-experience.js && node tests/rbac-role-experience.test.js
      - name: Validate role-aware navigation and action policy
        run: node --check js/app-shell.js && node --check js/m4-operations.js && node tests/rbac-ui-navigation.test.js
      - name: Validate M4 institutional operations
        run: node --check cloudflare/worker.js && node --check cloudflare/m4.js && node --check js/api-client.js && node --check js/m4-operations.js && node tests/m4-institutional-operations.test.js && python3 tests/m4-institutional-operations-migration.test.py
      - name: Validate Stage A LMS integrations
        run: node tests/stage-a-integration.test.js
      - name: Validate quiz timers, navigation and result flow
        run: node tests/quiz-engine.test.js
      - name: Validate responsive portal and dashboard shell
        run: node tests/app-shell.test.js
      - name: Validate institution admin dashboard metrics and role views
        run: node --check js/institution-dashboard.js && node tests/institution-dashboard.test.js && node tests/institution-hod-workspace.test.js
      - name: Install Playwright Chromium for Mathematics browser QA
        run: npm install --no-save playwright@1.64.1 && npx playwright install --with-deps chromium
      - name: Validate five-paper all-format repeat protection
        run: node tests/five-paper-repeat-protection.test.js
      - name: Smoke-test online Mathematics Standard and Basic examinations
        run: node tests/mathematics-browser-smoke.test.js
      - name: Smoke-test online Class 10 English Language & Literature examination
        run: node tests/english-browser-smoke.test.js
