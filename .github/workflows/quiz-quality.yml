name: ExamGuru Quest quiz quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiz-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate audited Science paper blueprint, generation and rendering
        run: node tests/exam-paper-generator.test.js && node tests/exam-paper-renderer.test.js && node tests/exam-paper-release.test.js
      - name: Build shared Science bank from the maintained source
        run: node tests/build-science-bank-fixture.js
      - name: Validate existing Science MCQs in Exam Paper Studio
        run: node tests/science-integration.test.js
      - name: Validate Stage C learning model, mastery and adaptive selection
        run: node tests/learning-model.test.js
      - name: Validate canonical ExamGuru Quest URLs
        run: node tests/canonical-url.test.js
      - name: Validate Stage D Study Library model and rendering
        run: node tests/study-model.test.js
      - name: Validate Stage C backup compatibility and restore flow
        run: node tests/profile-model.test.js && node tests/profile-page.test.js
      - name: Validate NSO, IMO and IEO blueprints and section weighting
        run: node tests/olympiad-blueprints.test.js
      - name: Validate session timing, weighted marks and summary model
        run: node tests/session-model.test.js
      - name: Validate Stage A LMS integrations
        run: node tests/stage-a-integration.test.js
      - name: Validate quiz timers, navigation and result flow
        run: node tests/quiz-engine.test.js
      - name: Validate responsive portal and dashboard shell
        run: node tests/app-shell.test.js
