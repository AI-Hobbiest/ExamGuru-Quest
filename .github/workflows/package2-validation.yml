name: Package 2 Parent and Student Experience Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'help.html'
      - 'js/app-shell.js'
      - 'js/parent-dashboard.js'
      - 'js/report-print.js'
      - 'tests/parent-experience.test.js'
      - 'tests/report-print.test.js'
      - '.github/workflows/package2-validation.yml'

permissions:
  contents: read

jobs:
  parent-student-experience:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/app-shell.js
          node --check js/parent-dashboard.js
          node --check js/report-print.js
          node --check tests/parent-experience.test.js
      - name: Test Parent and Student Help Centre and child switching
        run: node tests/parent-experience.test.js
      - name: Test report printing and popup fallback
        run: node tests/report-print.test.js
      - name: Test app navigation and role boundaries
        run: node tests/app-shell.test.js
