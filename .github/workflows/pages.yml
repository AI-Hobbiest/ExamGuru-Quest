name: Deploy ExamGuru Quest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run quiz regression tests
        run: |
          node tests/clat-engine.test.js
          node tests/clat-pdf.test.js
          node tests/clat-dashboard.test.js
          node tests/olympiad-blueprints.test.js
          node tests/class3-english.test.js
          node tests/class3-mathematics.test.js
          node tests/class3-sof-blueprint.test.js
          node tests/class3-imo-bank.test.js
          node tests/exam-paper-generator.test.js
          node tests/mathematics-blueprints.test.js
          node tests/mathematics-question-bank.test.js
          node tests/mathematics-mcq-integration.test.js
          node tests/exam-paper-release.test.js
          node tests/exam-paper-renderer.test.js
          node tests/assessment-manager.test.js
          node tests/assessment-analytics.test.js
          for file in js/clat-engine.js js/clat-practice.js js/clat-dashboard-model.js js/clat-dashboard.js js/report-print.js js/app-shell.js js/profile-manager.js js/parent-dashboard.js js/assessment-manager.js js/parent-assessments.js js/assigned-test.js js/assigned-paper.js js/assigned-tests-dashboard.js js/exam-paper-studio.js js/exam-paper-self-study.js; do node --check "$file"; done
          node tests/session-model.test.js
          node tests/quiz-engine.test.js
          node tests/learning-model.test.js
          node tests/study-model.test.js
          node tests/canonical-url.test.js
          node tests/stage-a-integration.test.js
          node tests/app-shell.test.js
          node tests/report-print.test.js
          node tests/parent-experience.test.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble website files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp clat-login.html _site/clat-login.html
          cp clat-dashboard.html _site/clat-dashboard.html
          cp science.html _site/science.html
          cp practice.html _site/practice.html
          cp profile.html _site/profile.html
          cp admin.html _site/admin.html
          cp dashboard.html _site/dashboard.html
          cp learning.html _site/learning.html
          cp study.html _site/study.html
          cp parent.html _site/parent.html
          cp exam-practice.html _site/exam-practice.html
          cp clat.html _site/clat.html
          cp help.html _site/help.html
          cp assigned-test.html _site/assigned-test.html
          cp assigned-paper.html _site/assigned-paper.html
          cp .nojekyll _site/.nojekyll
          mkdir -p _site/js _site/data _site/css _site/data/contracts/v1 _site/data/clat
          cp css/branding.css _site/css/branding.css
          cp css/theme-roles.css _site/css/theme-roles.css
          cp css/theme-roles-v2.css _site/css/theme-roles-v2.css
          cp css/app-shell.css _site/css/app-shell.css
          cp css/admin.css _site/css/admin.css
          cp css/question-media.css _site/css/question-media.css
          cp js/storage.js _site/js/storage.js
          cp js/competency-tagger.js _site/js/competency-tagger.js
          cp js/question-bank.js _site/js/question-bank.js
          cp js/olympiad-blueprints.js _site/js/olympiad-blueprints.js
          cp js/exam-paper-generator.js _site/js/exam-paper-generator.js
          cp js/exam-paper-renderer.js _site/js/exam-paper-renderer.js
          cp js/exam-paper-studio.js _site/js/exam-paper-studio.js
          cp js/assessment-manager.js _site/js/assessment-manager.js
          cp js/assigned-test.js _site/js/assigned-test.js
          cp js/assigned-paper.js _site/js/assigned-paper.js
          cp js/assigned-tests-dashboard.js _site/js/assigned-tests-dashboard.js
          cp js/parent-assessments.js _site/js/parent-assessments.js
          cp js/exam-paper-self-study.js _site/js/exam-paper-self-study.js
          cp js/clat-engine.js _site/js/clat-engine.js
          cp js/clat-dashboard-model.js _site/js/clat-dashboard-model.js
          cp js/clat-dashboard.js _site/js/clat-dashboard.js
          cp js/clat-practice.js _site/js/clat-practice.js
          cp js/clat-pdf.js _site/js/clat-pdf.js
          cp js/session-model.js _site/js/session-model.js
          cp js/learning-model.js _site/js/learning-model.js
          cp js/learning-center.js _site/js/learning-center.js
          cp js/study-model.js _site/js/study-model.js
          cp js/study-library.js _site/js/study-library.js
          cp js/profile-model.js _site/js/profile-model.js
          cp js/student-auth.js _site/js/student-auth.js
          cp js/login-page.js _site/js/login-page.js
          cp js/page-access.js _site/js/page-access.js
          cp js/api-config.js _site/js/api-config.js
          cp js/api-client.js _site/js/api-client.js
          cp js/profile-manager.js _site/js/profile-manager.js
          cp js/admin-manager.js _site/js/admin-manager.js
          cp js/static-account-admin.js _site/js/static-account-admin.js
          cp js/family-access-admin.js _site/js/family-access-admin.js
          cp js/parent-dashboard.js _site/js/parent-dashboard.js
          cp js/report-print.js _site/js/report-print.js
          cp js/app-shell.js _site/js/app-shell.js
          cp js/gamification.js _site/js/gamification.js
          cp js/dashboard-manager.js _site/js/dashboard-manager.js
          cp js/quiz-engine.js _site/js/quiz-engine.js
          cp data/*.json _site/data/
          cp -R data/exam-papers _site/data/exam-papers
          cp -R data/clat/. _site/data/clat/
          # Merge the maintained English topic overrides into the deployed bank.
          node <<'NODE'
          const fs = require('fs');
          const englishPath = '_site/data/english.json';
          const overrideFiles = [
            '_site/data/english-chapters-19-25.json',
            '_site/data/english-chapters-26-28.json',
            '_site/data/english-topics-29-33.json',
            '_site/data/english-topics-34-37.json'
          ];
          const english = JSON.parse(fs.readFileSync(englishPath, 'utf8'));
          const overrides = overrideFiles.flatMap(path => JSON.parse(fs.readFileSync(path, 'utf8')));
          const norm = value => String(value || '').toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9]+/g, ' ').trim();
          if (overrides.length !== 19) throw new Error('Expected exactly 19 English topic overrides, got ' + overrides.length);
          const replaced = new Set();
          for (const override of overrides) {
            if (!Array.isArray(override.questions) || override.questions.length !== 100) {
              throw new Error('English override must contain 100 questions: ' + override.title);
            }
            const target = english.find(ch => norm(ch.key) === norm(override.key))
              || english.find(ch => norm(ch.title) === norm(override.title))
              || english.find(ch => Number(ch.chapter_no) === Number(override.chapter_no));
            if (!target) throw new Error('English topic not found for override: ' + override.title);
            if (norm(target.title) !== norm(override.title)) {
              throw new Error('Chapter/key matched a different English title: ' + override.title + ' vs ' + target.title);
            }
            if (replaced.has(norm(target.title))) throw new Error('Duplicate English override for ' + target.title);
            replaced.add(norm(target.title));
            target.questions = override.questions;
          }
          const total = english.reduce((sum, chapter) => sum + chapter.questions.length, 0);
          if (english.length !== 37 || total !== 3700 || replaced.size !== 19) {
            throw new Error('Merged English bank expected 37 topic sets / 3700 MCQs / 19 upgrades, got ' + english.length + ' / ' + total + ' / ' + replaced.size);
          }
          for (const chapter of english) {
            if (!chapter.title || !Array.isArray(chapter.questions) || chapter.questions.length !== 100) {
              throw new Error('English topic does not have exactly 100 questions: ' + chapter.title + ' (' + (chapter.questions || []).length + ')');
            }
          }
          fs.writeFileSync(englishPath, JSON.stringify(english, null, 2) + String.fromCharCode(10));
          console.log('Merged four English override files: 19 topic sets; deployed English total: ' + total + '.');
          NODE
          # Merge the maintained Social Science topic overrides into the deployed bank.
          node <<'NODE'
          const fs = require('fs');
          const socialPath = '_site/data/social-science.json';
          const overrideFiles = [
            '_site/data/social-science-topics-01-06.json',
            '_site/data/social-science-topics-07-12.json',
            '_site/data/social-science-topics-13-17.json',
            '_site/data/social-science-topics-18-22.json'
          ];
          const social = JSON.parse(fs.readFileSync(socialPath, 'utf8'));
          const overrides = overrideFiles.flatMap(path => JSON.parse(fs.readFileSync(path, 'utf8')));
          const norm = value => String(value || '').toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9]+/g, ' ').trim();
          if (overrides.length !== 22) throw new Error('Expected exactly 22 Social Science topic overrides, got ' + overrides.length);
          const replaced = new Set();
          for (const override of overrides) {
            if (!Array.isArray(override.questions) || override.questions.length !== 100) {
              throw new Error('Social Science override must contain 100 questions: ' + override.title);
            }
            const target = social.find(ch => norm(ch.key) === norm(override.key))
              || social.find(ch => norm(ch.title) === norm(override.title))
              || social.find(ch => Number(ch.chapter_no) === Number(override.chapter_no));
            if (!target) throw new Error('Social Science topic not found for override: ' + override.title);
            if (norm(target.title) !== norm(override.title)) {
              throw new Error('Topic/key matched a different Social Science title: ' + override.title + ' vs ' + target.title);
            }
            if (replaced.has(norm(target.title))) throw new Error('Duplicate Social Science override for ' + target.title);
            const ids = new Set();
            const stems = new Set();
            for (const question of override.questions) {
              if (!question.question || !Array.isArray(question.options) || question.options.length !== 4 ||
                  new Set(question.options).size !== 4 || !Number.isInteger(question.answer) ||
                  question.answer < 0 || question.answer > 3 || !question.explanation) {
                throw new Error('Malformed Social Science MCQ in ' + override.title + ', id ' + question.id);
              }
              if (ids.has(question.id)) throw new Error('Duplicate question ID in ' + override.title + ': ' + question.id);
              ids.add(question.id);
              const stem = norm(question.question);
              if (stems.has(stem)) throw new Error('Duplicate question stem in ' + override.title + ': ' + question.question);
              stems.add(stem);
            }
            replaced.add(norm(target.title));
            target.questions = override.questions;
          }
          for (const chapter of social) {
            const n = Number(chapter.chapter_no);
            if (n === 3) chapter.section = 'History · board scope limited to pre-modern world through conquest, disease and trade (sections 1.1–1.3)';
            if (n === 4) chapter.section = 'History · periodic assessment only';
            if (n === 12) chapter.section = 'Geography · board exam map work only';
            if (n === 21) chapter.section = 'Economics · board scope: what globalisation is and factors enabling it; other themes are project/enrichment';
            if (n === 22) chapter.section = 'Economics · project work / internal assessment';
          }
          const total = social.reduce((sum, chapter) => sum + chapter.questions.length, 0);
          if (social.length !== 22 || total !== 2200 || replaced.size !== 22) {
            throw new Error('Merged Social Science bank expected 22 topics / 2200 MCQs / 22 upgrades, got ' + social.length + ' / ' + total + ' / ' + replaced.size);
          }
          for (const chapter of social) {
            if (!chapter.title || !Array.isArray(chapter.questions) || chapter.questions.length !== 100) {
              throw new Error('Social Science topic does not have exactly 100 questions: ' + chapter.title + ' (' + (chapter.questions || []).length + ')');
            }
          }
          fs.writeFileSync(socialPath, JSON.stringify(social, null, 2) + String.fromCharCode(10));
          console.log('Merged four Social Science override files: 22 topic sets; deployed total: ' + total + '.');
          NODE
          cp data/contracts/v1/* _site/data/contracts/v1/
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -d knowledge ]; then cp -R knowledge _site/knowledge; fi
          mkdir -p _site/science-payload
          cp science-payload/part-*.txt _site/science-payload/
      - name: Validate Science module payload
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const encoded = fs.readFileSync('_site/science-payload/part-01.txt','utf8').trim()
            + Array.from({length:16},(_,i)=>fs.readFileSync('_site/science-payload/part-'+String(i+2).padStart(2,'0')+'.txt','utf8').trim()).join('');
          const html = zlib.gunzipSync(Buffer.from(encoded,'base64')).toString('utf8');
          const match = html.match(/const EMBEDDED_CHAPTERS = (\[[\s\S]*?\]);\s*\nlet chapters/);
          if (!match) throw new Error('Embedded chapter data was not found.');
          const chapters = JSON.parse(match[1]);
          const count = chapters.reduce((sum,chapter)=>sum+chapter.questions.length,0);
          if (chapters.length !== 14 || count !== 1400 || !html.includes('id="chapter"') || !html.includes("$('chapter').innerHTML=chapters.map")) {
            throw new Error('Science validation failed: '+chapters.length+' chapters, '+count+' questions, dropdown='+html.includes('id="chapter"'));
          }
          // Generate the shared-engine bank from the already validated compressed Science source.
          const sharedChapters = chapters.map((chapter, chapterIndex) => ({
            chapter_no: chapter.chapter_no || chapter.chapterNo || chapterIndex + 1,
            title: chapter.title,
            key: chapter.key || chapter.chapterKey,
            questions: chapter.questions.map((question, questionIndex) => {
              const options = question.options || question.choices;
              const rawAnswer = question.answer ?? question.correctAnswer ?? question.correctOption ?? question.correct_option;
              let answer = Number(rawAnswer);
              if (!Number.isInteger(answer) && typeof rawAnswer === 'string') {
                const letter = rawAnswer.trim().toUpperCase();
                if (/^[A-D]$/.test(letter)) answer = letter.charCodeAt(0) - 65;
                else answer = Array.isArray(options) ? options.findIndex(option => String(option).trim() === rawAnswer.trim()) : -1;
              }
              return {
                id: question.id ?? question.questionId ?? questionIndex + 1,
                question: question.question || question.prompt || question.text,
                options,
                answer,
                explanation: question.explanation || question.rationale || 'Review the related concept in your textbook, then try this question again.',
                difficulty: question.difficulty || 'Medium'
              };
            })
          }));
          for (const chapter of sharedChapters) {
            if (!chapter.title || !Array.isArray(chapter.questions) || !chapter.questions.length) {
              throw new Error('Science shared bank has an empty chapter.');
            }
            for (const question of chapter.questions) {
              if (!question.question || !Array.isArray(question.options) || question.options.length !== 4 ||
                  !Number.isInteger(question.answer) || question.answer < 0 || question.answer > 3 ||
                  !question.explanation) {
                throw new Error('Malformed Science MCQ in chapter '+chapter.title+', id '+question.id);
              }
            }
          }
          if (!fs.existsSync('data/science.json')) {
            fs.writeFileSync('_site/data/science.json', JSON.stringify(sharedChapters, null, 2) + String.fromCharCode(10));
            console.log('Generated shared Science bank from legacy payload: '+sharedChapters.length+' chapters, '+count+' MCQs.');
          } else {
            console.log('Using committed data/science.json as the editable Science source of truth.');
          }
          const expected = {
            science: { chapters: 14, questions: 1400 },
            mathematics: { chapters: 14, questions: 1400 },
            english: { chapters: 37, questions: 3700 },
            'social-science': { chapters: 22, questions: 2200 },
            hindi: { chapters: 27, questions: 254 },
            'class-3-mathematics': { chapters: 14, questions: 1400 },
            'class-3-mathematics-sof': { chapters: 4, questions: 247 },
            'class-6-science': { chapters: 12, questions: 1200 },
            'class-6-mathematics': { chapters: 10, questions: 1000 },
            'class-6-english': { chapters: 16, questions: 1600 },
            'class-6-social-science': { chapters: 14, questions: 1400 },
            'class-6-mathematics-sof': { chapters: 13, questions: 635 },
            'class-6-science-sof': { chapters: 14, questions: 685 },
            'class-6-english-sof': { chapters: 12, questions: 600 }
          };
          for (const [name, totals] of Object.entries(expected)) {
            const data = JSON.parse(fs.readFileSync('_site/data/'+name+'.json','utf8'));
            const questionCount = data.reduce((sum, chapter) => sum + chapter.questions.length, 0);
            const editableScience = name === 'science' && fs.existsSync('data/science.json');
            if ((!editableScience && data.length !== totals.chapters) || (!editableScience && questionCount !== totals.questions) ||
                (editableScience && data.length < 1)) {
              throw new Error(name+' bank count mismatch: '+data.length+' chapters, '+questionCount+' questions.');
            }
            for (const chapter of data) {
              if (!chapter.title || !chapter.questions.length) throw new Error(name+' has an empty chapter.');
              for (const question of chapter.questions) {
                if (!question.question || !Array.isArray(question.options) || question.options.length !== 4 ||
                    !Number.isInteger(question.answer) || question.answer < 0 || question.answer > 3 ||
                    !question.explanation) {
                  throw new Error('Malformed MCQ in '+name+', chapter '+chapter.title+', id '+question.id);
                }
                if (question.images !== undefined) {
                  if (!Array.isArray(question.images)) throw new Error('Images must be an array in '+name+', chapter '+chapter.title+', question '+question.id);
                  for (const [imageIndex, image] of question.images.entries()) {
                    if (!image || typeof image.src !== 'string' || !image.alt || !image.alt.trim()) {
                      throw new Error('Image '+(imageIndex+1)+' needs a source and alt text in '+name+', question '+question.id);
                    }
                    const src=image.src.trim();
                    const dataUri=/^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+/]+={0,2}$/i.test(src);
                    const relative=/^(?:\.\/|\/)?[A-Za-z0-9._~!%()-]+(?:\/[A-Za-z0-9._~!%()-]+)*$/.test(src) &&
                      !src.startsWith('//') && !src.split('/').includes('..') && !src.includes(':');
                    if (!dataUri && !relative) throw new Error('Unsafe image source '+src+' in '+name+', question '+question.id);
                    if (!dataUri) {
                      const assetPath=src.replace(/^\.\//,'').replace(/^\//,'');
                      if (!fs.existsSync('_site/'+assetPath)) throw new Error('Missing image asset '+src+' referenced by '+name+', question '+question.id);
                    }
                  }
                }
              }
            }
            console.log('Validated '+name+': '+data.length+' topics, '+questionCount+' MCQs.');
          }
          for (const file of ['practice.html','profile.html','dashboard.html','learning.html','study.html','parent.html','admin.html','exam-practice.html','clat.html','clat-dashboard.html','help.html','js/competency-tagger.js','js/exam-paper-self-study.js','css/admin.css','js/admin-manager.js','js/student-auth.js','js/static-account-admin.js','js/family-access-admin.js','js/parent-dashboard.js','js/report-print.js','data/family-access.json','data/student-accounts.json','data/classes.json','data/knowledge-base.json','css/branding.css','css/app-shell.css','css/theme-roles.css','css/theme-roles-v2.css','css/question-media.css','js/app-shell.js','js/gamification.js','js/dashboard-manager.js','js/storage.js','js/question-bank.js','js/session-model.js','js/learning-model.js','js/learning-center.js','js/study-model.js','js/study-library.js','js/profile-model.js','js/profile-manager.js','js/quiz-engine.js','data/contracts/v1/question-bank.schema.json','data/contracts/v1/question-bank-import.schema.json','data/contracts/v1/student-profile.schema.json','data/contracts/v1/answer-record.schema.json','data/contracts/v1/test-attempt.schema.json','data/contracts/v1/local-store-envelope.schema.json','data/contracts/v1/backup.schema.json','data/science.json','data/mathematics.json','data/english.json','data/social-science.json','data/hindi.json','data/class-3-mathematics.json','data/class-3-mathematics-sof.json','data/class-6-science.json','data/class-6-mathematics.json','data/class-6-english.json','data/class-6-social-science.json','data/class-6-mathematics-sof.json','data/class-6-science-sof.json']) {
            if (!fs.existsSync('_site/'+file)) throw new Error('Missing deployed site file: '+file);
          }
          const examPractice=fs.readFileSync('_site/exam-practice.html','utf8');
          const clatPage=fs.readFileSync('_site/clat.html','utf8');
          if (!clatPage.includes('./js/clat-engine.js') || !clatPage.includes('./js/clat-practice.js') || !fs.existsSync('_site/data/clat/model-papers.json')) throw new Error('CLAT page, engine or model paper data is missing from deployment.');
          const clatDashboard=fs.readFileSync('_site/clat-dashboard.html','utf8');
          const clatDashboardScripts=['./js/student-auth.js','./js/page-access.js','./js/clat-dashboard-model.js','./js/clat-dashboard.js','./js/app-shell.js'].map(src=>clatDashboard.indexOf(src));
          if (clatDashboardScripts.some(index=>index<0) || !clatDashboardScripts.every((index,i)=>i===0||clatDashboardScripts[i-1]<index)) throw new Error('CLAT dashboard scripts are missing or out of order.');
          for (const required of ['id="totalXp"','id="levelValue"','id="papersCompleted"','id="streakValue"','id="sectionStrength"','id="recentAttemptList"']) if (!clatDashboard.includes(required)) throw new Error('CLAT dashboard feature missing: '+required);
          if (!clatDashboard.includes('AI-Enthusiast') || /JP Ganathe|Conceptualised by/i.test(clatDashboard)) throw new Error('CLAT dashboard must use AI-Enthusiast branding only.');
          for (const file of ['js/clat-dashboard-model.js','js/clat-dashboard.js']) if (!fs.existsSync('_site/'+file)) throw new Error('Missing CLAT dashboard script: '+file);

          if (!examPractice.includes('./js/exam-paper-generator.js') || !examPractice.includes('./js/exam-paper-self-study.js')) throw new Error('Exam Paper Practice page dependencies are missing.');
          if (!fs.existsSync('_site/js/exam-paper-self-study.js')) throw new Error('Exam Paper Practice controller was not packaged.');
          for (const asset of ['nephron-filtration.svg','alveolus-gas-exchange.svg','parallel-circuit-6-3.svg','parallel-circuit-4-12.svg','hypermetropia-correction.svg','prism-dispersion-spectrum.svg']) {
            if (!fs.existsSync('_site/assets/exam-papers/science/'+asset)) throw new Error('Science exam diagram is missing from deployment: '+asset);
          }
          const admin=fs.readFileSync('_site/admin.html','utf8');
          for (const required of ['data-tab="banks"','data-tab="classes"','data-tab="knowledge"','data-tab="students"','data-tab="leaderboard"','data-tab="access"','data-tab="operations"']) {
            if (!admin.includes(required)) throw new Error('Admin workspace section missing: '+required);
          }
          if (!admin.includes('./js/admin-manager.js') || !admin.includes('./css/admin.css')) throw new Error('Admin workspace scripts/styles missing.');
          const adminScripts=['./js/storage.js','./js/competency-tagger.js','./js/question-bank.js','./js/session-model.js','./js/profile-model.js','./js/admin-manager.js','./js/app-shell.js'].map(src=>admin.indexOf(src));
          if (adminScripts.some(index=>index<0) || !adminScripts.every((index,i)=>i===0||adminScripts[i-1]<index)) throw new Error('Admin workspace scripts are missing or out of order.');
          const classCatalog=JSON.parse(fs.readFileSync('_site/data/classes.json','utf8'));
          if (classCatalog.kind!=='class-catalog' || !Array.isArray(classCatalog.classes) || !classCatalog.classes.some(item=>String(item.classId)==='10')) throw new Error('Class catalogue is missing Class 10.');
          const class3=classCatalog.classes.find(item=>String(item.classId)==='3');
          if (!class3 || !['mathematics','mathematics-sof'].every(subject=>(class3.subjects||[]).includes(subject))) throw new Error('Class 3 catalogue must include Mathematics and SOF IMO.');
          const class6=classCatalog.classes.find(item=>String(item.classId)==='6');
          if (!class6 || !['science','mathematics','english','social-science','mathematics-sof','science-sof'].every(subject=>(class6.subjects||[]).includes(subject))) throw new Error('Class 6 subject catalogue is missing a required CBSE or SOF Mathematics subject.');
          const resourceManifest=JSON.parse(fs.readFileSync('_site/data/knowledge-base.json','utf8'));
          if (resourceManifest.kind!=='knowledge-base-manifest' || !Array.isArray(resourceManifest.resources)) throw new Error('Knowledge-base manifest is invalid.');
          const profilePage=fs.readFileSync('_site/profile.html','utf8');
          if (!profilePage.includes('id="studentId"') || !profilePage.includes('id="school"') || !profilePage.includes('id="city"') || !profilePage.includes('id="state"') || !profilePage.includes('id="classLevel"')) throw new Error('Profile fields are missing.');
          if (!profilePage.includes('Export JSON backup') || !profilePage.includes('Import JSON backup')) throw new Error('Profile backup controls are missing.');
          const profileScripts=['./js/storage.js','./js/profile-model.js','./js/learning-model.js','./js/student-auth.js','./js/report-print.js','./js/profile-manager.js'].map(src=>profilePage.indexOf(src));
          if (profileScripts.some(index=>index<0) || !profileScripts.every((index,i)=>i===0||profileScripts[i-1]<index)) throw new Error('Profile scripts are missing or out of order.');
          const parentPage=fs.readFileSync('_site/parent.html','utf8');
          const parentScripts=['./js/student-auth.js','./js/storage.js','./js/gamification.js','./js/assessment-manager.js','./js/report-print.js','./js/parent-dashboard.js'].map(src=>parentPage.indexOf(src));
          if (parentScripts.some(index=>index<0) || !parentScripts.every((index,i)=>i===0||parentScripts[i-1]<index)) throw new Error('Parent report scripts are missing or out of order.');
          const learningPage=fs.readFileSync('_site/learning.html','utf8');
          for (const required of ['id="recommendations"','id="mistakes"','id="bookmarkList"','id="topicMasteryList"','id="mistakeStatusFilter"']) {
            if (!learningPage.includes(required)) throw new Error('Learning Hub section missing: '+required);
          }
          const learningScripts=['./js/storage.js','./js/question-bank.js','./js/learning-model.js','./js/profile-model.js','./js/student-auth.js','./js/page-access.js','./js/learning-center.js','./js/app-shell.js'].map(src=>learningPage.indexOf(src));
          if (learningScripts.some(index=>index<0) || !learningScripts.every((index,i)=>i===0||learningScripts[i-1]<index)) throw new Error('Learning Hub scripts are missing or out of order.');
          const studyPage=fs.readFileSync('_site/study.html','utf8');
          for (const required of ['id="studyResourceList"','id="studySearch"','id="studySubject"','id="studyStatus"']) {
            if (!studyPage.includes(required)) throw new Error('Study Library control missing: '+required);
          }
          const studyScripts=['./js/storage.js','./js/student-auth.js','./js/page-access.js','./js/study-model.js','./js/study-library.js','./js/app-shell.js'].map(src=>studyPage.indexOf(src));
          if (studyScripts.some(index=>index<0) || !studyScripts.every((index,i)=>i===0||studyScripts[i-1]<index)) throw new Error('Study Library scripts are missing or out of order.');
          const studyModel=fs.readFileSync('_site/js/study-model.js','utf8');
          for (const required of ['visibleResources','filterResources','safePath','normalizeProgress']) {
            if (!studyModel.includes(required)) throw new Error('Study Library model capability missing: '+required);
          }
          const learningModel=fs.readFileSync('_site/js/learning-model.js','utf8');
          for (const required of ['recordOutcome','toggleBookmark','summarizeTopics','adaptiveOrder','recommendations']) {
            if (!learningModel.includes(required)) throw new Error('Learning model capability missing: '+required);
          }
          const dashboard=fs.readFileSync('_site/dashboard.html','utf8');
          for (const required of ['id="dashboardTitle"','id="levelNumber"','id="levelProgressFill"','id="scoreTrendChart"','id="subjectAccuracyChart"','id="weeklyActivityChart"','id="badgeGrid"']) {
            if (!dashboard.includes(required)) throw new Error('Dashboard feature missing: '+required);
          }
          const dashboardScripts=['./js/storage.js','./js/profile-model.js','./js/gamification.js','./js/dashboard-manager.js','./js/app-shell.js'].map(src=>dashboard.indexOf(src));
          if (dashboardScripts.some(index=>index<0) || !dashboardScripts.every((index,i)=>i===0||dashboardScripts[i-1]<index)) throw new Error('Dashboard scripts are missing or out of order.');
          // The homepage is now the sign-in landing page. Validate its current contract,
          // rather than requiring profile and subject links from the retired homepage layout.
          const homepage=fs.readFileSync('_site/index.html','utf8');
          for (const required of ['id="studentLoginForm"','id="username"','id="password"','id="adminLoginForm"','id="adminUsername"','id="adminPassword"','./js/login-page.js','./js/student-auth.js','./js/app-shell.js']) {
            if (!homepage.includes(required)) throw new Error('Login landing page is missing '+required);
          }
          if (!homepage.includes('Sign in as administrator') || !homepage.includes('Conceptualised by') || !homepage.includes('JP Ganathe')) {
            throw new Error('Login landing page admin notice or attribution is missing.');
          }
          const loginScript=fs.readFileSync('_site/js/login-page.js','utf8');
          if (!loginScript.includes('C10StudentAuth.login') || !loginScript.includes('./dashboard.html')) {
            throw new Error('Login handler does not authenticate students and route to dashboard.');
          }
          const shell=fs.readFileSync('_site/js/app-shell.js','utf8');
          for (const required of ['c10-auth-changed','dashboard.html','profile.html','Sign out','c10-topbar-brand','c10HeaderSignout']) {
            if (!shell.includes(required)) throw new Error('Role-aware navigation is missing '+required);
          }
          const dashboardLanding=fs.readFileSync('_site/dashboard.html','utf8');
          for (const slug of ['subject=science','subject=mathematics','subject=english','subject=social-science','subject=hindi','subject=mathematics-sof','subject=science-sof']) {
            if (!dashboardLanding.includes(slug)) throw new Error('Dashboard subject launch link is missing '+slug);
          }
          const sciencePage=fs.readFileSync('_site/science.html','utf8');
          if (!sciencePage.includes('practice.html?subject=science')) throw new Error('Science compatibility route does not forward to the shared engine.');
          const quizEngine=fs.readFileSync('_site/js/quiz-engine.js','utf8');
          if (!quizEngine.includes('science: { title:"Science"')) throw new Error('Science is missing from the shared engine subject registry.');
          const practice=fs.readFileSync('_site/practice.html','utf8');
          if (!practice.includes('Conceptualised by')) throw new Error('Practice-page attribution is missing.');
          if (!practice.includes('MCQs in practice bank')) throw new Error('Student-facing bank count must be labelled as MCQs only.');
          if (!practice.includes('id="questionMedia"') || !practice.includes('id="imageViewer"') || !practice.includes('./css/question-media.css')) throw new Error('Practice page is missing question-image UI.');
          const imageBankSchema=JSON.parse(fs.readFileSync('_site/data/contracts/v1/question-bank.schema.json','utf8'));
          const questionSchema=imageBankSchema.properties.chapters.items.properties.questions.items;
          if (!questionSchema.properties.images) throw new Error('Question-bank contract is missing optional image metadata.');
          for (const field of ['competency','competencyTagStatus','competencyTagReason']) if (!questionSchema.required.includes(field)) throw new Error('New MCQ contract must require '+field+'.');
          const imageImportSchema=JSON.parse(fs.readFileSync('_site/data/contracts/v1/question-bank-import.schema.json','utf8'));
          if (!imageImportSchema.items.properties.questions.items.properties.images) throw new Error('Legacy import contract is missing optional image metadata.');
          const sequence=['./js/storage.js','./js/question-bank.js','./js/olympiad-blueprints.js','./js/session-model.js','./js/learning-model.js','./js/quiz-engine.js'].map(src=>practice.indexOf(src));
          if (sequence.some(index=>index<0) || !sequence.every((index,i)=>i===0||sequence[i-1]<index)) throw new Error('Practice dependencies are missing or out of order.');
          if (!practice.includes('data-mode="olympiad"') || !practice.includes('data-mode="adaptive"') || !practice.includes('data-mode="bookmarks"') || !practice.includes('id="difficultyFilter"') || !practice.includes('id="bookmarkQuestionBtn"') || !practice.includes('id="sectionResults"') || !practice.includes('id="navigatorSectionSummary"')) throw new Error('Practice page is missing an exam or intelligent-learning control.');
          for (const file of ['question-bank.schema.json','question-bank-import.schema.json','student-profile.schema.json','answer-record.schema.json','test-attempt.schema.json','local-store-envelope.schema.json','backup.schema.json']) {
            const schema=JSON.parse(fs.readFileSync('_site/data/contracts/v1/'+file,'utf8'));
            if (!schema.$schema || !schema.title) throw new Error('Invalid contract metadata: '+file);
          }
          console.log('Validated subject links, branding, versioned contracts and deployed assets.');

          NODE
      - name: Tag and audit competency across every deployed MCQ bank
        run: node scripts/tag-mcq-banks.js _site/data && node tests/mcq-competency.test.js _site/data
      - name: Test foundation contracts and migration
        run: node tests/foundation.test.js
      - name: Test session timing and result model
        run: node tests/session-model.test.js
      - name: Test complete student journey
        run: node tests/student-journey.test.js && node tests/quiz-engine.test.js
      - name: Test Science shared-engine migration
        run: node tests/science-integration.test.js
      - name: Test Class 3 Mathematics and English banks
        run: node tests/class3-mathematics.test.js && node tests/class3-english.test.js && node tests/class3-sof-blueprint.test.js && node tests/class3-imo-bank.test.js
      - name: "Test Class 6 banks: Science, Mathematics, English and Social Science"
        run: node tests/class6-science.test.js
      - name: Test profile model and privacy fields
        run: node tests/profile-model.test.js
      - name: Test profile page save/history and JSON backup
        run: node tests/profile-page.test.js
      - name: Test levels XP badges and responsive navigation
        run: node tests/gamification.test.js && node tests/app-shell.test.js && node tests/report-print.test.js
      - name: Test Admin Workspace data handling and safety boundaries
        run: node tests/admin-workspace.test.js && node tests/account-contract.test.js && node tests/static-accounts.test.js
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
