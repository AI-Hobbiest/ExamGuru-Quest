<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Demo sign-in · ExamGuru Quest</title><link rel="stylesheet" href="./css/branding.css"><style>body{font:16px system-ui;background:#f5f3fb;color:#241f4a;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.card{background:white;border:1px solid #e4e0f0;border-radius:18px;padding:28px;width:min(420px,100%)}label{display:block;font-weight:700;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d8d3e8;border-radius:9px;font:inherit}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:9px;background:#5143ad;color:white;font-weight:800}.muted{color:#716d85;line-height:1.5}.status{padding:10px;background:#f1effa;border-radius:9px;margin-top:12px}</style></head><body><main class="card"><p><b>EXAMGURU QUEST · DEMO</b></p><h1>Demo sign-in</h1><p class="muted">Use the time-limited credentials supplied by the Platform Admin. Demo access is read-only and uses synthetic records.</p><form id="f"><label for="u">Username</label><input id="u" autocomplete="username" required><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required><button>Enter demo</button></form><p id="s" class="status" role="status">Your demo session expires automatically.</p><script src="./js/api-config.js"></script><script>
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const s=document.getElementById("s"),base=String(window.C10_API_BASE||"").replace(/\/+$/,"");if(!base){s.textContent="Demo sign-in is not configured yet.";return;}try{const r=await fetch(base+"/api/demo/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("u").value,password:document.getElementById("p").value}),cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Sign-in failed");sessionStorage.setItem("eg_demo_token",d.token);location.replace("./demo-preview.html");}catch(x){s.textContent=x.message;}});
</script></main></body></html>
